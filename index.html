<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="База знаний ВлГУ — читалка конспектов прямо из репозитория obsidian-base." />
<title>База знаний ВлГУ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>window.MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']]},svg:{fontCache:'global'}};</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js" id="mathjax-script" async onload="document.dispatchEvent(new Event('mathjax-ready'))"></script>
<style>
:root{--bg:#0b0d12;--grid:rgba(139,92,246,.045);--panel:rgba(18,21,30,.86);--card:rgba(24,28,39,.88);--card-hover:rgba(31,36,50,.96);--text:#f4f5fa;--muted:#9ba3b4;--faint:#6e7687;--border:rgba(255,255,255,.09);--border-hover:rgba(139,92,246,.52);--accent:#8b5cf6;--accent-light:#a78bfa;--accent-soft:rgba(139,92,246,.15);--green:#34d399;--shadow:0 20px 60px rgba(0,0,0,.28);--sidebar:290px}
:root:not([data-theme="light"]){color-scheme:dark}
:root[data-theme="light"]{--bg:#f7f7fb;--grid:rgba(109,40,217,.05);--panel:rgba(255,255,255,.86);--card:rgba(255,255,255,.92);--card-hover:#fff;--text:#171923;--muted:#626a7d;--faint:#8f96a7;--border:rgba(23,25,35,.1);--border-hover:rgba(109,40,217,.45);--accent:#7047eb;--accent-light:#825cf0;--accent-soft:rgba(112,71,235,.12);--shadow:0 20px 60px rgba(23,25,35,.1);color-scheme:light}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{min-width:320px;margin:0;overflow-x:hidden;color:var(--text);background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:42px 42px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;transition:.2s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
.app{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
.sidebar{position:fixed;top:0;left:0;z-index:20;display:flex;flex-direction:column;width:var(--sidebar);height:100vh;padding:calc(20px + env(safe-area-inset-top,0px)) 14px 16px;overflow-y:auto;background:var(--panel);border-right:1px solid var(--border);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:12px;padding:8px 8px 22px;cursor:pointer}
.brand-logo{display:grid;width:40px;height:40px;place-items:center;font-size:19px;background:linear-gradient(135deg,var(--accent),#4f46e5);border-radius:13px;box-shadow:0 10px 22px rgba(124,92,246,.28)}
.brand-title{font-size:15px;font-weight:760;letter-spacing:-.03em}.brand-subtitle{margin-top:2px;color:var(--faint);font-size:11.5px}
.sidebar-search{position:relative;margin:0 2px 16px}
.sidebar-search span{position:absolute;top:50%;left:12px;color:var(--faint);transform:translateY(-50%);pointer-events:none}
.sidebar-search input{width:100%;height:40px;padding:0 12px 0 36px;color:var(--text);outline:none;background:rgba(127,127,127,.06);border:1px solid var(--border);border-radius:10px}
.sidebar-search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tree{flex:1}
.tree-subject{margin-bottom:4px}
.tree-subject-head{display:flex;align-items:center;gap:9px;min-height:38px;padding:0 8px;color:var(--text);font-size:13.5px;font-weight:680;border-radius:9px;cursor:pointer}
.tree-subject-head:hover{background:rgba(127,127,127,.08)}
.tree-subject-head .chev{margin-left:auto;color:var(--faint);font-size:11px;transition:.15s}
.tree-subject.open .chev{transform:rotate(90deg)}
.tree-group{display:none;padding-left:14px}
.tree-subject.open .tree-group{display:block}
.tree-group-label{margin:8px 0 3px 26px;color:var(--faint);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tree-file{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 8px 0 26px;color:var(--muted);font-size:13px;border-radius:8px;border-left:2px solid transparent}
.tree-file:hover{color:var(--text);background:rgba(127,127,127,.07)}
.tree-file.active{color:var(--text);background:var(--accent-soft);border-left-color:var(--accent)}
.sidebar-bottom{display:grid;gap:6px;padding:10px 2px 0;margin-top:10px;border-top:1px solid var(--border)}
.theme-toggle,.help-link{display:flex;align-items:center;gap:9px;width:100%;min-height:38px;padding:0 8px;color:var(--muted);text-align:left;background:transparent;border:0;border-radius:9px}
.theme-toggle:hover,.help-link:hover{color:var(--text);background:rgba(127,127,127,.08)}
.main{grid-column:2;min-width:0;padding:26px 38px 70px}
.container{width:min(880px,100%);margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}
.breadcrumbs{display:flex;flex-wrap:wrap;align-items:center;gap:7px;color:var(--faint);font-size:13.5px;min-width:0}
.breadcrumbs a:hover{color:var(--accent-light)}.breadcrumbs-current{color:var(--muted)}
.topbar-actions{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.topbar-button{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:0 13px;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:9px;font-size:13px}
.topbar-button:hover{color:var(--text);border-color:var(--border-hover)}
.mobile-menu-button{display:none}
.overlay{display:none;position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.4)}.overlay.open{display:block}
/* HERO / OVERVIEW */
.hero{position:relative;padding:44px;overflow:hidden;background:radial-gradient(circle at 88% 18%,rgba(139,92,246,.28),transparent 28%),var(--panel);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;margin-bottom:16px;color:var(--accent-light);font-size:12.5px;font-weight:650;background:var(--accent-soft);border:1px solid rgba(139,92,246,.22);border-radius:999px}
.status-dot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 0 4px rgba(52,211,153,.12)}
h1.hero-h1{max-width:560px;margin:0;font-size:clamp(28px,4.4vw,44px);font-weight:780;line-height:1.08;letter-spacing:-.05em}
.hero-description{max-width:540px;margin:14px 0 0;color:var(--muted);font-size:15.5px;line-height:1.65}
.hero-stats{display:flex;flex-wrap:wrap;gap:20px;margin-top:22px;color:var(--faint);font-size:12.5px}
.hero-stats strong{color:var(--text);font-weight:700}
.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:26px}
.quick-card{position:relative;padding:18px;background:var(--card);border:1px solid var(--border);border-radius:14px;transition:.18s}
.quick-card:hover{background:var(--card-hover);border-color:var(--border-hover);transform:translateY(-3px)}
.quick-card-icon{display:grid;width:36px;height:36px;place-items:center;margin-bottom:14px;font-size:17px;background:var(--accent-soft);border-radius:11px}
.quick-card h3{margin:0;font-size:14.5px}.quick-card p{margin:6px 0 0;color:var(--muted);font-size:12.5px;line-height:1.5}
.updates-title{margin:30px 0 12px;font-size:16px;font-weight:720}
.update-item{display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.update-item:last-child{border-bottom:0}
.update-dot{width:8px;height:8px;margin-top:6px;background:var(--accent);border-radius:50%}
.update-name{display:block;font-size:13px;font-weight:600}.update-name:hover{color:var(--accent-light)}
.update-date{display:block;margin-top:3px;color:var(--faint);font-size:11.5px}
.state-msg{padding:30px;color:var(--muted);font-size:13.5px;text-align:center}
/* NOTE VIEW */
.note-card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:38px 42px;box-shadow:var(--shadow)}
.note-title{margin:0 0 10px;font-size:clamp(24px,3.4vw,33px);font-weight:780;letter-spacing:-.03em;line-height:1.15}
.note-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.note-badge{padding:4px 10px;color:var(--muted);font-size:12px;font-weight:600;background:rgba(127,127,127,.09);border:1px solid var(--border);border-radius:999px}
.note-body{font-size:15.5px;line-height:1.75;color:var(--text)}
.note-body h1,.note-body h2,.note-body h3{letter-spacing:-.02em;line-height:1.3}
.note-body h1{font-size:24px;margin:30px 0 12px}.note-body h2{font-size:20px;margin:26px 0 10px}.note-body h3{font-size:17px;margin:20px 0 8px}
.note-body p{margin:12px 0}.note-body ul,.note-body ol{padding-left:22px;margin:12px 0}.note-body li{margin:5px 0}
.note-body code{padding:2px 6px;font-size:.88em;background:rgba(127,127,127,.12);border-radius:6px;font-family:"IBM Plex Mono",ui-monospace,monospace}
.note-body pre{padding:16px 18px;overflow-x:auto;background:rgba(0,0,0,.28);border:1px solid var(--border);border-radius:12px}
:root[data-theme="light"] .note-body pre{background:rgba(0,0,0,.04)}
.note-body pre code{padding:0;background:none}
.note-body blockquote{margin:14px 0;padding:4px 16px;color:var(--muted);border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.note-body table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px}
.note-body th,.note-body td{padding:8px 12px;border:1px solid var(--border);text-align:left}
.note-body th{background:rgba(127,127,127,.07)}
.note-body img{max-width:100%;border-radius:10px;margin:10px 0}
.note-body a{color:var(--accent-light);text-decoration:underline}
.note-body hr{border:0;border-top:1px solid var(--border);margin:24px 0}
.wikilink-missing{color:var(--faint);border-bottom:1px dashed var(--faint);cursor:help}
@media(max-width:1050px){.quick-grid{grid-template-columns:1fr}}
@media(max-width:820px){.app{display:block}.sidebar{left:-100%;transition:left .25s}.sidebar.open{left:0;box-shadow:20px 0 60px rgba(0,0,0,.35)}.main{padding:18px 16px 55px}.mobile-menu-button{display:inline-flex}.note-card{padding:26px 20px}.hero{padding:26px 20px}}
</style>
</head>
<body>
<div class="app">
<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="brand" id="brandHome"><div class="brand-logo">🎓</div><div><div class="brand-title">База знаний ВлГУ</div><div class="brand-subtitle">Читалка конспектов</div></div></div>
  <label class="sidebar-search"><span>⌕</span><input id="sidebarSearch" type="search" placeholder="Поиск конспекта..." autocomplete="off" /></label>
  <div class="tree" id="tree"><div class="state-msg">Загружаю структуру репозитория…</div></div>
  <div class="sidebar-bottom">
    <button class="theme-toggle" id="themeToggle" type="button"><span id="themeIcon">☾</span><span id="themeText">Тёмная тема</span></button>
    <a class="help-link" href="https://github.com/vlsu-hub/obsidian-base/blob/main/CONTRIBUTING.md" target="_blank" rel="noopener noreferrer"><span>?</span>Как добавить материал</a>
  </div>
</aside>
<main class="main"><div class="container">
  <header class="topbar">
    <div class="breadcrumbs" id="breadcrumbs"><a id="crumbHome" href="#">Главная</a></div>
    <div class="topbar-actions">
      <button class="topbar-button mobile-menu-button" id="mobileMenuButton" type="button" aria-label="Меню">☰</button>
      <a class="topbar-button" id="githubLink" href="https://github.com/vlsu-hub/obsidian-base" target="_blank" rel="noopener noreferrer">↗ GitHub</a>
    </div>
  </header>
  <section id="overviewView">
    <div class="hero">
      <div class="eyebrow"><span class="status-dot"></span>База обновляется студентами</div>
      <h1 class="hero-h1">Учебные материалы без хаоса.</h1>
      <p class="hero-description" id="heroDescription">Загружаю данные из репозитория…</p>
      <div class="hero-stats" id="heroStats"></div>
      <div class="quick-grid" id="quickGrid"></div>
    </div>
    <h3 class="updates-title">Последние обновления</h3>
    <div id="updatesList"><div class="update-item"><span class="update-dot"></span><div><span class="update-name">Загружаю коммиты…</span></div></div></div>
  </section>
  <section id="noteView" style="display:none">
    <article class="note-card">
      <h1 class="note-title" id="noteTitle"></h1>
      <div class="note-meta" id="noteMeta"></div>
      <div class="note-body" id="noteBody"><div class="state-msg">Загружаю конспект…</div></div>
    </article>
  </section>
</div></main>
</div>
<script>
(function(){
  var OWNER='vlsu-hub', REPO='obsidian-base', BRANCH='main';
  var RAW = 'https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/'+BRANCH+'/';
  var sidebar=document.getElementById('sidebar'), overlay=document.getElementById('overlay');
  var overviewView=document.getElementById('overviewView'), noteView=document.getElementById('noteView');
  var breadcrumbs=document.getElementById('breadcrumbs');
  var allNotes=[]; // {path, subject, group, filename, title}

  document.getElementById('mobileMenuButton').addEventListener('click',function(){sidebar.classList.toggle('open');overlay.classList.toggle('open')});
  overlay.addEventListener('click',function(){sidebar.classList.remove('open');overlay.classList.remove('open')});
  document.getElementById('brandHome').addEventListener('click',showOverview);
  document.getElementById('crumbHome').addEventListener('click',function(e){e.preventDefault();showOverview()});

  var themeToggle=document.getElementById('themeToggle'),themeIcon=document.getElementById('themeIcon'),themeText=document.getElementById('themeText');
  function setTheme(isLight){document.documentElement.setAttribute('data-theme',isLight?'light':'dark');themeIcon.textContent=isLight?'☀':'☾';themeText.textContent=isLight?'Светлая тема':'Тёмная тема';try{localStorage.setItem('vlsu-kb-theme',isLight?'light':'dark')}catch(e){}}
  try{var saved=localStorage.getItem('vlsu-kb-theme');if(saved==='light')setTheme(true);else if(saved==='dark')setTheme(false)}catch(e){}
  themeToggle.addEventListener('click',function(){setTheme(document.documentElement.getAttribute('data-theme')!=='light')});

  function ghApi(path){return fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+path,{headers:{Accept:'application/vnd.github+json'}}).then(function(r){if(!r.ok)throw new Error('GitHub API: '+r.status);return r.json()})}
  function relDate(iso){var d=new Date(iso),diff=Math.floor((Date.now()-d)/86400000);if(diff<=0)return'сегодня';if(diff===1)return'вчера';return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}
  var GROUP_LABELS={'лекции':'Лекции','практика':'Практика','лабы':'Лабораторные','лабораторные':'Лабораторные'};
  function groupLabel(folder){var m=folder.match(/^\d+_([а-яё]+)/i);if(m){var key=m[1].toLowerCase();return GROUP_LABELS[key]||(key.charAt(0).toUpperCase()+key.slice(1))}return folder}
  function topicFromFilename(fn){var m=fn.match(/^(КП|ЛБ|ПР|ЭКЗ) (\d{2}) - (.*)\.md$/i);if(m)return m[3].replace(/_/g,' ');return fn.replace(/\.md$/i,'')}
  function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}

  ghApi('/git/trees/'+BRANCH+'?recursive=1').then(function(data){
    var subjects={}; // name -> {groups:{label:[files]}}
    (data.tree||[]).forEach(function(item){
      if(item.type!=='blob')return;
      var parts=item.path.split('/');
      if(parts.length<3||!/семестр/i.test(parts[0]))return;
      var subject=parts[1], filename=parts[parts.length-1];
      if(!filename.endsWith('.md')||filename.startsWith('_'))return;
      var group=parts.length>=4?groupLabel(parts[2]):'Материалы';
      subjects[subject]=subjects[subject]||{};
      subjects[subject][group]=subjects[subject][group]||[];
      var note={path:item.path,subject:subject,group:group,filename:filename,title:cap(topicFromFilename(filename))};
      subjects[subject][group].push(note);
      allNotes.push(note);
    });
    renderTree(subjects);
    renderOverview(subjects);
    maybeOpenFromHash();
  }).catch(function(err){
    document.getElementById('tree').innerHTML='<div class="state-msg">Не удалось загрузить структуру репозитория ('+err.message+').</div>';
  });

  ghApi('/commits?path=1%20%D1%81%D0%B5%D0%BC%D0%B5%D1%81%D1%82%D1%80&per_page=4').then(function(commits){
    var el=document.getElementById('updatesList');
    if(!commits.length){el.innerHTML='<div class="state-msg">Пока нет изменений.</div>';return}
    el.innerHTML=commits.map(function(c){var msg=c.commit.message.split('\n')[0].replace(/</g,'&lt;');return '<div class="update-item"><span class="update-dot"></span><div><a class="update-name" href="'+c.html_url+'" target="_blank" rel="noopener noreferrer">'+msg+'</a><span class="update-date">'+relDate(c.commit.author.date)+'</span></div></div>'}).join('');
    var st=document.getElementById('statUpdated'); if(st) st.innerHTML='Обновлено: <strong>'+relDate(commits[0].commit.author.date)+'</strong>';
  }).catch(function(){document.getElementById('updatesList').innerHTML='<div class="state-msg">Не удалось загрузить историю коммитов.</div>'});

  function renderTree(subjects){
    var tree=document.getElementById('tree'); tree.innerHTML='';
    Object.keys(subjects).sort().forEach(function(subject,i){
      var wrap=document.createElement('div'); wrap.className='tree-subject'+(i===0?' open':'');
      var head=document.createElement('div'); head.className='tree-subject-head';
      head.innerHTML='<span>'+subject+'</span><span class="chev">▸</span>';
      head.addEventListener('click',function(){wrap.classList.toggle('open')});
      wrap.appendChild(head);
      var groupBox=document.createElement('div'); groupBox.className='tree-group';
      Object.keys(subjects[subject]).forEach(function(group){
        var lbl=document.createElement('div'); lbl.className='tree-group-label'; lbl.textContent=group; groupBox.appendChild(lbl);
        subjects[subject][group].forEach(function(note){
          var a=document.createElement('div'); a.className='tree-file'; a.textContent=note.title; a.dataset.path=note.path;
          a.addEventListener('click',function(){openNote(note.path);sidebar.classList.remove('open');overlay.classList.remove('open')});
          groupBox.appendChild(a);
        });
      });
      wrap.appendChild(groupBox); tree.appendChild(wrap);
    });
  }

  function renderOverview(subjects){
    var names=Object.keys(subjects), total=allNotes.length;
    document.getElementById('heroStats').innerHTML='<span><strong>'+names.length+'</strong> предмета в каталоге</span><span><strong>'+total+'</strong> учебных материалов</span><span id="statUpdated">Обновлено: <strong>—</strong></span>';
    document.getElementById('heroDescription').textContent='Конспекты, лабораторные работы и практики студентов ВлГУ — сейчас в базе: '+names.join(', ').toLowerCase()+'.';
    var icons={'физика':'⚛','основы военной подготовки':'🎖'};
    document.getElementById('quickGrid').innerHTML=names.map(function(name){
      var count=Object.values(subjects[name]).reduce(function(a,g){return a+g.length},0);
      return '<div class="quick-card" data-subject="'+name+'"><div class="quick-card-icon">'+(icons[name.toLowerCase()]||'📘')+'</div><h3>'+name+'</h3><p>'+count+' материалов — нажмите, чтобы открыть первый</p></div>';
    }).join('');
    document.querySelectorAll('.quick-card').forEach(function(card){
      card.addEventListener('click',function(){
        var subj=card.dataset.subject, first=allNotes.find(function(n){return n.subject===subj});
        if(first)openNote(first.path);
      });
    });
  }

  document.getElementById('sidebarSearch').addEventListener('input',function(e){
    var q=e.target.value.trim().toLowerCase();
    document.querySelectorAll('.tree-file').forEach(function(el){
      var note=allNotes.find(function(n){return n.path===el.dataset.path});
      var show=!q||el.textContent.toLowerCase().includes(q)||(note&&note.subject.toLowerCase().includes(q));
      el.style.display=show?'flex':'none';
    });
    if(q){document.querySelectorAll('.tree-subject').forEach(function(w){w.classList.add('open')})}
  });

  function stripFrontmatter(text){
    var m=text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n([\s\S]*)$/);
    if(!m)return{meta:{},body:text};
    var meta={},lines=m[1].split(/\r?\n/),tags=[];
    lines.forEach(function(line){
      var dm=line.match(/^date:\s*(.+)$/); if(dm)meta.date=dm[1].trim();
      var tm=line.match(/^\s*-\s*(author|typer|editor)\/(.+)$/); if(tm)tags.push(tm[1]+'/'+tm[2].trim());
    });
    meta.tags=tags;
    return{meta:meta,body:m[2]};
  }

  function protectMath(text){
    var store=[];
    function stash(s){store.push(s);return '@@MATH'+(store.length-1)+'@@'}
    text=text.replace(/\$\$([\s\S]+?)\$\$/g,function(m){return stash(m)});
    text=text.replace(/\$([^\n$]+?)\$/g,function(m){return stash(m)});
    return{text:text,store:store};
  }
  function restoreMath(html,store){
    return html.replace(/@@MATH(\d+)@@/g,function(_,i){return store[+i]});
  }
  function renderCallouts(body){
    return body.replace(/^>\s*\[!(\w+)\]\s*(.*)$/gim,function(_,type,title){
      return '> **'+(title||cap(type))+'**  ';
    });
  }

  function resolveWikilinks(body,currentPath){
    var dir=currentPath.split('/').slice(0,-1).join('/');
    body=body.replace(/!\[\[([^\]|]+?)(\|[^\]]+)?\]\]/g,function(_,file){
      var url=RAW+dir+'/attachments/'+encodeURIComponent(file);
      return '![' + file + '](' + url + ')';
    });
    body=body.replace(/\[\[([^\]|]+?)(\|([^\]]+))?\]\]/g,function(_,target,__,alias){
      var label=alias||target;
      var found=allNotes.find(function(n){return n.title.toLowerCase()===target.trim().toLowerCase()||n.filename.toLowerCase().indexOf(target.trim().toLowerCase())!==-1});
      if(found)return '['+label+'](#/'+encodeURIComponent(found.path)+')';
      return '<span class="wikilink-missing" title="Заметка не найдена: '+target+'">'+label+'</span>';
    });
    return body;
  }

  function openNote(path){
    var note=allNotes.find(function(n){return n.path===path});
    overviewView.style.display='none'; noteView.style.display='block';
    document.getElementById('noteBody').innerHTML='<div class="state-msg">Загружаю конспект…</div>';
    document.querySelectorAll('.tree-file').forEach(function(el){el.classList.toggle('active',el.dataset.path===path)});
    location.hash='/'+encodeURIComponent(path);
    updateBreadcrumbs(note);
    document.getElementById('githubLink').href='https://github.com/'+OWNER+'/'+REPO+'/blob/'+BRANCH+'/'+path.split('/').map(encodeURIComponent).join('/');

    fetch(RAW+path.split('/').map(encodeURIComponent).join('/')).then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status); return r.text();
    }).then(function(raw){
      var parsed=stripFrontmatter(raw);
      var body=resolveWikilinks(parsed.body,path);
      body=renderCallouts(body);
      var protectedMath=protectMath(body);
      document.getElementById('noteTitle').textContent=note?note.title:path;
      var meta=[];
      if(parsed.meta.date)meta.push('<span class="note-badge">📅 '+parsed.meta.date+'</span>');
      (parsed.meta.tags||[]).forEach(function(t){meta.push('<span class="note-badge">'+t+'</span>')});
      if(note)meta.push('<span class="note-badge">'+note.subject+' · '+note.group+'</span>');
      document.getElementById('noteMeta').innerHTML=meta.join('');
      var html=marked.parse(protectedMath.text);
      html=restoreMath(html,protectedMath.store);
      document.getElementById('noteBody').innerHTML=html;
      document.getElementById('noteBody').querySelectorAll('a[href^="#/"]').forEach(function(a){
        a.addEventListener('click',function(e){e.preventDefault();openNote(decodeURIComponent(a.getAttribute('href').slice(2)))});
      });
      if(window.MathJax&&window.MathJax.typesetPromise){window.MathJax.typesetPromise([document.getElementById('noteBody')])}
      else{document.addEventListener('mathjax-ready',function once(){window.MathJax.typesetPromise([document.getElementById('noteBody')]);document.removeEventListener('mathjax-ready',once)})}
    }).catch(function(err){
      document.getElementById('noteBody').innerHTML='<div class="state-msg">Не удалось загрузить файл: '+err.message+'</div>';
    });
  }

  function updateBreadcrumbs(note){
    var html='<a id="crumbHome" href="#">Главная</a>';
    if(note){html+='<span>/</span><span>'+note.subject+'</span><span>/</span><span class="breadcrumbs-current">'+note.title+'</span>'}
    breadcrumbs.innerHTML=html;
    document.getElementById('crumbHome').addEventListener('click',function(e){e.preventDefault();showOverview()});
  }

  function showOverview(){
    noteView.style.display='none'; overviewView.style.display='block';
    document.querySelectorAll('.tree-file').forEach(function(el){el.classList.remove('active')});
    location.hash=''; updateBreadcrumbs(null);
    sidebar.classList.remove('open'); overlay.classList.remove('open');
  }

  function maybeOpenFromHash(){
    var h=location.hash;
    if(h&&h.indexOf('#/')===0){var path=decodeURIComponent(h.slice(2)); if(allNotes.find(function(n){return n.path===path}))openNote(path)}
  }
})();
</script>
</body>
</html>
